<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>皮卡丘手机群控 · 短信工作台</title><link rel="icon" href="/brand-logo.jpg"><link rel="stylesheet" href="/dashboard.css"></head>
<body>
<main>
 <aside class="devices"><div class="section-title"><h2>设备列表</h2><span id="device-count">USB</span></div><div class="app-version" aria-label="当前版本">v0.1.0</div><p class="muted">选择一台手机开始处理</p><label class="device-sort-label" for="device-sort">排序<select id="device-sort"><option value="followup">待跟进优先</option><option value="unread">未读消息数优先</option></select></label><div id="device-list" aria-label="已连接设备"></div><div id="previews"></div></aside>
 <section class="phone-panel"><div class="section-title"><h2>实时画面 <span id="screen-device" class="muted"></span></h2><button id="screen-expand" class="secondary" type="button" aria-pressed="false">放大画面</button></div><div id="selected"><div id="empty"><span class="empty-icon" aria-hidden="true">&#9889;</span><h3>选择要控制的手机</h3><p>左侧查看设备，右侧阅读短信与译文。</p></div></div></section>
 <section class="work-panel">
  <div class="message-heading"><div class="reading-heading-meta"><div class="reading-meta-info"><span id="reading-device-number" class="reading-device-number">设备：—</span><h3>短信与译文</h3><span class="peer-number">对方号码：<strong id="peer-phone">—</strong></span><span id="message-count" class="muted">0 条</span></div><div class="heading-actions"><button id="capture-current" type="button" class="secondary">读取当前会话</button><button id="refresh-messages" type="button" class="secondary" title="重新加载电脑保存的短信和译文，不读取手机新消息">刷新已保存记录</button></div></div><div class="reading-heading-controls"><div class="followup-controls"><label class="followup-toggle"><input id="device-followup" type="checkbox" disabled> 此联系人待跟进</label><details id="followup-panel" class="followup-panel"><summary>此设备待跟进联系人 <span id="followup-contact-count" class="muted">0</span></summary><div id="followup-contact-list" class="followup-contact-list"></div></details><details class="profile" id="profile-panel"><summary><span>联系人资料</span><span id="profile-state" class="tag">待导出</span></summary><div class="profile-body"><button id="summarize-contact" type="button" disabled>去汇总</button><div id="profile-result"><p>复制双方文字并打开 ChatGPT，仅填入输入框，由你确认发送。</p></div></div></details></div></div></div>
  <p id="archive-status" role="status" class="archive-status">选择手机后加载已保存的翻译记录。</p>
  <div id="messages" class="messages" aria-label="短信中英对照"><div class="message-empty">短信原文与中文译文将在这里呈现。</div></div>
  <section class="composer-wrap chat-composer" id="reply-box" aria-label="消息输入">
   <div class="composer">
    <div class="chat-compose-row">
     <div class="emoji-wrap"><button id="toggle-emoji" type="button" class="emoji-toggle" aria-label="选择表情" aria-expanded="false" disabled>☺</button><div id="emoji-picker" class="emoji-picker" role="group" aria-label="表情选择" hidden></div></div>
     <textarea id="reply-zh" rows="1" placeholder="输入消息…" aria-label="消息文字" disabled></textarea>
     <button id="send-reply" type="button" class="chat-send" aria-label="发送" title="发送" disabled>确认发送</button>
    </div>

   </div>
  </section>
 </section>
</main>
<dialog id="device-label-dialog" class="device-label-dialog" aria-labelledby="device-label-title">
 <form id="device-label-form">
  <h2 id="device-label-title">编辑设备编号</h2>
  <label for="device-number-input">设备编号</label><input id="device-number-input" type="text" maxlength="16" required placeholder="例如 01、A01">
  <p class="muted">按设备保存到当前浏览器，刷新后保留。</p>
  <p id="device-label-error" role="alert"></p>
  <div class="device-label-actions"><button id="device-label-cancel" type="button" class="secondary">取消</button><button type="submit">保存</button></div>
 </form>
</dialog>
<div id="device-context-menu" class="device-context-menu" role="menu" aria-label="设备操作" hidden><button id="device-context-edit" type="button" role="menuitem">编辑编号</button><div class="device-menu-label">备注</div><button id="device-context-followup" type="button" role="menuitemradio" aria-checked="false">待跟进</button><button id="device-context-none" type="button" role="menuitemradio" aria-checked="true">无</button></div>
<script src="/gpt_export.js"></script><script src="/workspace.js"></script><script src="/dashboard.js"></script></body></html>
