<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机群控 · 短信工作台</title><link rel="icon" href="/brand-logo.jpg"><link rel="stylesheet" href="/dashboard.css"></head>
<body>
<section id="global-monitor" class="global-monitor" aria-label="设备列表">
 <header class="monitor-header"><div><h1>设备列表 <span id="monitor-count" class="muted">正在连接…</span><span id="monitor-notice" class="monitor-notice" role="status" aria-live="polite">选择设备开始操作</span></h1></div><div class="monitor-actions"><span class="runtime-status">
  <span class="app-version">v0.1.15</span>
  <span id="cpu-usage" class="cpu-usage" data-level="unknown" title="正在获取整台电脑的 CPU 使用率" aria-label="CPU 使用率暂不可用"><span aria-hidden="true">CPU</span><span class="cpu-bar" aria-hidden="true"><span id="cpu-bar-fill" class="cpu-bar-fill"></span></span><span id="cpu-percent" class="cpu-percent" aria-hidden="true">--%</span></span></span><button id="monitor-layout" type="button" class="secondary" aria-pressed="false">单排显示</button><label class="monitor-size-control" for="monitor-size">画面大小 <input id="monitor-size" type="range" min="50" max="480" step="1" value="160"><output id="monitor-size-value" for="monitor-size">160 px</output></label><label>排序 <select id="monitor-sort"><option value="number">编号从小到大</option><option value="followup">待跟进优先</option><option value="unread">未读消息数优先</option></select></label><label class="scan-toggle"><input id="auto-scan" type="checkbox" checked disabled>自动遍历</label><button id="monitor-refresh" type="button" class="secondary">刷新设备</button></div></header>

 <div id="monitor-grid" class="monitor-grid"></div>
 <div id="monitor-empty" class="monitor-empty" hidden>尚未发现手机，请连接 USB、解锁并信任此电脑，然后刷新设备。</div>
</section>
<main>
 <div id="device-list-state" hidden><span id="device-count"></span><button id="refresh-devices" type="button">刷新设备</button><select id="device-sort"><option value="number">编号从小到大</option><option value="followup">待跟进优先</option><option value="unread">未读消息数优先</option></select><div id="device-list"></div><div id="previews"></div></div>
 <section class="phone-panel"><div class="section-title"><h2>实时画面</h2><div class="phone-actions"><button id="phone-home" class="secondary" type="button" disabled>主页</button><button id="phone-screenshot" class="secondary" type="button" disabled>截屏</button><details class="device-setup"><summary aria-label="没有画面？帮助"><span class="device-setup-icon" aria-hidden="true">i</span><span id="device-setup-device" class="device-setup-device" hidden></span></summary><div class="device-setup-popover"><button id="reveal-developer-mode" class="secondary" type="button" disabled>显示开发者入口</button><p id="developer-mode-status" class="muted" role="status">选中手机后，请在手机上手动开启开发者模式：设置内搜索“开发者”或“Developer”，若找不到，就点击本弹窗的“显示开发者入口”按钮后间隔10秒再搜索。</p></div></details></div></div><nav id="current-display-devices" class="current-display-devices" aria-label="当前已显示的设备列表" hidden></nav><div id="selected"><div id="empty"><span class="empty-icon" aria-hidden="true">&#9889;</span><h3>选择要控制的手机</h3><p>从上方设备列表选择设备，右侧阅读短信原文。</p></div></div></section>
 <section class="work-panel">
  <div class="message-heading"><div id="contact-profile-fields" class="contact-profile-fields" aria-label="联系人资料"><div class="profile-info-container"><div class="reading-meta-info"><h3>短信原文</h3><span class="peer-number">对方号码：<strong id="peer-phone">—</strong></span><span id="message-count" class="muted">0 条</span></div><div class="contact-profile-top"><input id="contact-profile-field-0" data-contact-field="日期" type="text" maxlength="1000" placeholder="日期" aria-label="日期" disabled><input id="contact-profile-field-1" data-contact-field="姓名" type="text" maxlength="1000" placeholder="姓名" aria-label="姓名" disabled><input id="contact-profile-field-2" data-contact-field="年龄" type="text" maxlength="1000" placeholder="年龄" aria-label="年龄" disabled><input id="contact-profile-field-3" data-contact-field="工作" type="text" maxlength="1000" placeholder="工作" aria-label="工作" disabled></div><div class="heading-actions"><button id="sync-full-history" type="button" class="secondary" title="从手机同步短信数据库，可能需要较长时间" hidden>同步完整历史</button><button id="refresh-messages" type="button" class="secondary" title="重新加载电脑保存的短信原文，不读取手机新消息" hidden>刷新已保存记录</button></div></div><div class="profile-followup-container"><div class="reading-heading-controls"><div class="followup-controls"><label class="followup-toggle"><input id="device-followup" type="checkbox" disabled>此号码待跟进</label><details id="followup-panel" class="followup-panel"><summary>此设备待跟进号码 <span id="followup-contact-count" class="muted">0</span></summary><div id="followup-contact-list" class="followup-contact-list"></div></details></div></div><div class="contact-profile-bottom"><input id="contact-profile-field-4" data-contact-field="地区" type="text" maxlength="1000" placeholder="地区" aria-label="地区" disabled><input id="contact-profile-field-5" data-contact-field="婚否" type="text" maxlength="1000" placeholder="婚否" aria-label="婚否" disabled><input id="contact-profile-field-6" data-contact-field="爱好" type="text" maxlength="1000" placeholder="爱好" aria-label="爱好" disabled></div></div></div></div>
  <div class="foreground-reading"><button id="capture-current" type="button" class="secondary" title="只读取手机屏幕当前已显示的气泡，不等待数据库备份">一键翻译</button><span id="foreground-status" role="status">自动读取：等待当前手机</span><button id="foreground-resume" type="button" class="secondary" hidden>恢复自动读取</button></div><div id="messages" class="messages" aria-label="短信原文"><div class="message-empty">读取的短信原文将在这里呈现。</div></div>
  <section class="composer-wrap chat-composer" id="reply-box" aria-label="消息输入">
   <div class="composer">
    <div class="chat-compose-row">
     <div class="emoji-wrap"><button id="toggle-emoji" type="button" class="emoji-toggle" aria-label="选择表情" aria-expanded="false" disabled>☺</button><div id="emoji-picker" class="emoji-picker" role="group" aria-label="表情选择" hidden></div></div>
     <textarea id="reply-zh" rows="1" placeholder="输入消息，回车粘贴到手机；Shift+Enter 换行" aria-label="消息文字" disabled></textarea>
     <button id="paste-to-phone" type="button" class="secondary" title="将此处正文粘贴到当前手机短信输入框，由你点击手机发送按钮" disabled>粘贴到手机</button>
     <button id="send-reply" type="button" class="chat-send" aria-label="发送" title="发送" disabled>确认发送</button>
    </div>

   </div>
  </section>
 </section>
</main>
<dialog id="phone-screenshot-dialog" class="phone-screenshot-dialog" aria-labelledby="phone-screenshot-title">
 <div class="screenshot-heading"><h2 id="phone-screenshot-title">手机截图</h2><button id="phone-screenshot-close" type="button" class="secondary">关闭</button></div>
 <p id="phone-screenshot-status" class="muted" role="status"></p>
 <img id="phone-screenshot-image" alt="所选手机的静态截图" hidden>
</dialog>
<dialog id="device-label-dialog" class="device-label-dialog" aria-labelledby="device-label-title">
 <form id="device-label-form">
  <h2 id="device-label-title">编辑设备编号</h2>
  <label for="device-number-input">设备编号</label><input id="device-number-input" type="text" maxlength="16" required placeholder="例如 01、A01">
  <p class="muted">按设备保存到当前浏览器，刷新后保留。</p>
  <p id="device-label-error" role="alert"></p>
  <div class="device-label-actions"><button id="device-label-cancel" type="button" class="secondary">取消</button><button type="submit">保存</button></div>
 </form>
</dialog>
<div id="device-context-menu" class="device-context-menu" role="menu" aria-label="设备操作" hidden><button id="device-context-edit" type="button" role="menuitem">编辑编号</button><button id="device-context-connection" type="button" role="menuitem">接入此台</button><button id="device-context-readonly" type="button" role="menuitem">仅监看：锁定鼠标和键盘</button><button id="device-context-reconnect" type="button" role="menuitem">重新连接此设备</button><button id="device-context-trust" type="button" role="menuitem">重新建立信任</button><div class="device-menu-label">备注</div><button id="device-context-followup" type="button" role="menuitemradio" aria-checked="false">待跟进</button><button id="device-context-none" type="button" role="menuitemradio" aria-checked="true">无</button></div>
<script src="/contact_profile.js"></script><script src="/workspace.js"></script><script src="/dashboard.js"></script><script src="/foreground.js"></script></body></html>
