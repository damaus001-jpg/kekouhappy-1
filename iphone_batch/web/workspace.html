<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机群控 · 短信工作台</title><link rel="icon" href="/brand-logo.jpg"><link rel="stylesheet" href="/dashboard.css"></head>
<body>
<main>
 <aside class="devices"><div class="section-title"><h2>设备列表</h2><div class="device-list-actions"><span id="device-count">USB</span><button id="refresh-devices" class="secondary" type="button" title="重新检测 USB 手机" aria-label="刷新设备列表">↻</button></div></div><div class="app-version" aria-label="当前版本">v0.1.5</div><p class="muted">选择一台手机开始处理</p><label class="scan-toggle"><input id="auto-scan" type="checkbox" checked disabled>自动遍历<span id="auto-scan-status" role="status">加载中</span></label><label class="device-sort-label" for="device-sort">排序<select id="device-sort"><option value="followup">待跟进优先</option><option value="unread">未读消息数优先</option></select></label><div id="device-list" aria-label="已连接设备"></div><div id="previews"></div></aside>
 <section class="phone-panel"><div class="section-title"><h2>实时画面 <span id="screen-device" class="muted"></span></h2><button id="phone-home" class="secondary" type="button" disabled>手机主页</button><button id="screen-expand" class="secondary" type="button" aria-pressed="false">放大画面</button></div><details class="device-setup"><summary>没有画面？</summary><button id="reveal-developer-mode" class="secondary" type="button" disabled>显示开发者模式入口</button><p id="developer-mode-status" class="muted" role="status">选中手机后点击，再到手机设置中开启开发者模式。</p></details><div id="selected"><div id="empty"><span class="empty-icon" aria-hidden="true">&#9889;</span><h3>选择要控制的手机</h3><p>左侧查看设备，右侧阅读短信原文。</p></div></div></section>
 <section class="work-panel">
  <div class="message-heading"><div class="reading-heading-meta"><div class="reading-meta-info"><span id="reading-device-number" class="reading-device-number">设备：—</span><h3>短信原文</h3><span class="peer-number">对方号码：<strong id="peer-phone">—</strong></span><span id="message-count" class="muted">0 条</span></div><div class="heading-actions"><button id="capture-current" type="button" class="secondary">读取当前会话</button><button id="refresh-messages" type="button" class="secondary" title="重新加载电脑保存的短信原文，不读取手机新消息">刷新已保存记录</button></div></div><div class="reading-heading-controls"><div class="followup-controls"><label class="followup-toggle"><input id="device-followup" type="checkbox" disabled> 此联系人待跟进</label><details id="followup-panel" class="followup-panel"><summary>此设备待跟进联系人 <span id="followup-contact-count" class="muted">0</span></summary><div id="followup-contact-list" class="followup-contact-list"></div></details><details class="profile" id="profile-panel"><summary><span>联系人资料</span><span id="profile-state" class="tag">待填写</span></summary><div class="profile-body"><button id="summarize-contact" type="button" disabled>去汇总</button><p id="profile-contact" class="profile-contact"></p><div id="profile-result"></div>
<label class="profile-import">粘贴 GPT 汇总结果<textarea id="profile-paste" rows="3" maxlength="50000" placeholder="在此粘贴 GPT 输出的 JSON 资料" disabled></textarea></label><button id="apply-contact-profile" type="button" class="secondary" disabled>填入资料</button>
<div id="contact-profile-fields" class="contact-profile-fields"></div><div class="profile-save-row"><button id="save-contact-profile" type="button" disabled>保存资料</button><span id="profile-feedback" role="status"></span></div></div></details></div></div></div>
  <p id="archive-status" role="status" class="archive-status">选择手机后加载已保存的短信原文。</p>
  <div id="messages" class="messages" aria-label="短信原文"><div class="message-empty">读取的短信原文将在这里呈现。</div></div>
  <section class="composer-wrap chat-composer" id="reply-box" aria-label="消息输入">
   <div class="composer">
    <div class="chat-compose-row">
     <div class="emoji-wrap"><button id="toggle-emoji" type="button" class="emoji-toggle" aria-label="选择表情" aria-expanded="false" disabled>☺</button><div id="emoji-picker" class="emoji-picker" role="group" aria-label="表情选择" hidden></div></div>
     <textarea id="reply-zh" rows="1" placeholder="输入消息…" aria-label="消息文字" disabled></textarea>
     <button id="paste-to-phone" type="button" class="secondary" title="将此处正文粘贴到当前手机短信输入框，由你点击手机发送按钮" disabled>粘贴到手机</button>
     <button id="send-reply" type="button" class="chat-send" aria-label="发送" title="发送" disabled>确认发送</button>
    </div>

   </div>
  </section>
 </section>
</main>
<dialog id="device-label-dialog" class="device-label-dialog" aria-labelledby="device-label-title">
 <form id="device-label-form">
  <h2 id="device-label-title">编辑设备编号</h2>
  <label for="device-number-input">设备编号</label><input id="device-number-input" type="text" maxlength="16" required placeholder="例如 01、A01">
  <p class="muted">按设备保存到当前浏览器，刷新后保留。</p>
  <p id="device-label-error" role="alert"></p>
  <div class="device-label-actions"><button id="device-label-cancel" type="button" class="secondary">取消</button><button type="submit">保存</button></div>
 </form>
</dialog>
<div id="device-context-menu" class="device-context-menu" role="menu" aria-label="设备操作" hidden><button id="device-context-edit" type="button" role="menuitem">编辑编号</button><button id="device-context-reconnect" type="button" role="menuitem">重新连接此设备</button><button id="device-context-trust" type="button" role="menuitem">重新建立信任</button><div class="device-menu-label">备注</div><button id="device-context-followup" type="button" role="menuitemradio" aria-checked="false">待跟进</button><button id="device-context-none" type="button" role="menuitemradio" aria-checked="true">无</button></div>
<script src="/gpt_export.js"></script><script src="/contact_profile.js"></script><script src="/workspace.js"></script><script src="/dashboard.js"></script></body></html>
