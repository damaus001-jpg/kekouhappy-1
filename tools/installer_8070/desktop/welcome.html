<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机工作台 8070</title>
<style>html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101713;color:#eeeadd;font:16px "Microsoft YaHei",sans-serif}main{max-width:650px;padding:38px;background:#242d23;border:1px solid #4b563d;border-radius:12px}h1{font-size:26px;margin:0 0 18px}p{line-height:1.8;color:#b7c1ad}button{padding:12px 18px;margin:8px 8px 0 0;border:1px solid #4b563d;border-radius:8px;background:#f5d24c;color:#252313;font:inherit;cursor:pointer}button.secondary{background:#1b241d;color:#eeeadd}button:disabled{opacity:.5;cursor:wait}#status{min-height:48px;font-size:14px}</style>
<main><h1>手机工作台 8070</h1><p>先连接并解锁手机，确认信任此电脑及开发者模式。首次启动后台会请求管理员授权，以建立 USB 共享隧道。</p><button id="start">启动并打开工作台</button><button class="secondary" id="open">打开已运行的工作台</button><button class="secondary" id="control">后台管理</button><p id="status" role="status">此安装包已包含运行环境，无需预先安装 Python 或 Node。Apple USB 驱动需单独安装。</p></main>
<script>for(const action of ['start','open','control'])document.getElementById(action).onclick=async()=>{const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);document.getElementById('status').textContent='正在处理，请稍候…';try{const result=await window.workbenchDesktop[action]();document.getElementById('status').textContent=result.message||'';}catch(error){document.getElementById('status').textContent=error.message;}finally{buttons.forEach(b=>b.disabled=false);}};</script></html>
